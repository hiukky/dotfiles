onboarding = false

[keys]
# kept on ctrl+b by choice; this means nvim's insert-mode "start of line"
# (ctrl+b) is unreachable inside herdr — use 0/^ in normal mode instead.
prefix = "ctrl+b"

# left/right = tabs (the most frequent action in the agent+nvim workflow)
previous_tab = "prefix+left"
next_tab = "prefix+right"

# up/down = spaces (workspaces)
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

[[keys.command]]
# direct ctrl+period isn't reliable (classic terminals can't distinguish
# ctrl+. from a bare "."); behind the prefix the next key is always
# unmodified, so there's no such ambiguity.
key = "prefix+period"
type = "shell"
command = "herdr tab create --env HERDR_AUTOSTART=nvim --focus"
description = "new tab with nvim already open"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "codetree.open"
description = "open codetree explorer"

[ui]
show_agent_labels_on_pane_borders = false

agent_panel_sort = "spaces"
[ui.sidebar.spaces]
# $cwd is reported by a zsh (chpwd) hook in .zshrc, it's not a herdr builtin
rows = [["state_icon", "workspace"], ["$cwd"]]

[theme]
name = "gruvbox"
auto_switch = false
