# The Nerd Fonts this machine installs, and the catalog the font lab opens.
#
# One list drives three things: run_onchange_before_15-nerd-fonts.sh.tmpl
# (download, verify, install), the "Nerd Lab" profiles in
# .chezmoitemplates/windows-terminal-settings.json, and ~/.local/bin/nerd-font-lab.
# It mirrors the catalog uze's Rendering Lab measures against, so a font
# that looks wrong here can be compared with what the Lab recorded.
#
# Pinned to one release and verified by the sha256 in that release's
# SHA-256.txt: bumping `release` means updating every digest with it.
#
# Each family installs two builds. `Mono` shrinks every icon into one cell,
# which is the one to use when icons should sit at a letter's size; the plain
# build draws them up to ~1.7 cells wide. Propo is left out: a terminal forces
# it onto the grid anyway.
nerdFonts:
  release: v3.5.1
  families:
    - name: JetBrains Mono
      archive: JetBrainsMono.tar.xz
      sha256: 04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf
      files: JetBrainsMonoNerdFont
      plain:
        face: JetBrainsMono Nerd Font
        labGuid: "{19891e92-8479-55a8-a72a-1b45b23235a8}"
      mono:
        face: JetBrainsMono Nerd Font Mono
        labGuid: "{710f5f53-f531-58e6-bb59-bfd5d9b4df56}"
    - name: Fira Code
      archive: FiraCode.tar.xz
      sha256: 68e3bd6164864b8b514605bc34e3a87ac401c8c48682fcce6478c70263340207
