# The Nerd Fonts this machine installs, and the catalog the font lab opens.
#
# One list drives two things: run_onchange_before_15-nerd-fonts.sh.tmpl
# (download, verify, install) and ~/.local/bin/nerd-font-lab.
# Pinned to one release and verified by the sha256 in that release's
# SHA-256.txt: bumping `release` means updating every digest with it.
#
# Each family installs two builds. `Mono` shrinks every icon into one cell,
# which is the one to use when icons should sit at a letter's size; the plain
# build draws them up to ~1.7 cells wide. Propo is left out: a terminal forces
# it onto the grid anyway.
nerdFonts:
  release: v3.5.1
  families:
    - name: JetBrains Mono
      archive: JetBrainsMono.tar.xz
      sha256: 04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf
      files: JetBrainsMonoNerdFont
      plain:
        face: JetBrainsMono Nerd Font
      mono:
        face: JetBrainsMono Nerd Font Mono
    - name: Fira Code
      archive: FiraCode.tar.xz
      sha256: 68e3bd6164864b8b514605bc34e3a87ac401c8c48682fcce6478c70263340207
      files: FiraCodeNerdFont
      plain:
        face: FiraCode Nerd Font
      mono:
        face: FiraCode Nerd Font Mono
    - name: Hack
      archive: Hack.tar.xz
      sha256: cdd389472e10e2261520140ff1b382b4f8a226af5fd0b2735b975d31151d9c3c
      files: HackNerdFont
      plain:
        face: Hack Nerd Font
      mono:
        face: Hack Nerd Font Mono
    - name: Iosevka
      archive: Iosevka.tar.xz
      sha256: 3b94ea1dc3955756762f977b7677bca671947dd56bc755a6f8465a8e83b5f257
      files: IosevkaNerdFont
      plain:
        face: Iosevka Nerd Font
      mono:
        face: Iosevka Nerd Font Mono
    - name: Cascadia (Caskaydia Cove)
      archive: CascadiaCode.tar.xz
      sha256: ae598e9401e2846aa3ee364513715de0490b844a4b54f0768991f45f23aa8369
      files: CaskaydiaCoveNerdFont
      plain:
        face: CaskaydiaCove Nerd Font
      mono:
        face: CaskaydiaCove Nerd Font Mono
    - name: Meslo LG M
      archive: Meslo.tar.xz
      sha256: 6b6624632dc6873dfb7681c3f818e7c01ab601ab707690b6440933bbe57e2b11
      files: MesloLGMNerdFont
      plain:
        face: MesloLGM Nerd Font
      mono:
        face: MesloLGM Nerd Font Mono
    - name: Symbols only
      archive: NerdFontsSymbolsOnly.tar.xz
      sha256: 01172f37db8543edb102e5cb5c64101c9f4686630804d49b419aa07b23a69996
      files: SymbolsNerdFont
      # A symbols-only font is a fallback: the letters come from an unpatched
      # font and only the icons from this one.
      fallback: Cascadia Mono
      plain:
        face: Symbols Nerd Font
      mono:
        face: Symbols Nerd Font Mono
